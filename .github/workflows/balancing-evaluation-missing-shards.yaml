name: Balancing evaluation (missing shards)

# Declared study: 0_materials/validation_protocol/balancing-evaluation-v1.md (R056).
# Completes run 42673317372, whose shards 4, 5, 7, 8, 10, 13, 18 and 20 never received a job during a GitHub Actions incident.
# Same runner, shard numbers and seeds; this is the same declared study and not a second one.
# Do not edit this file on this branch after launch: a push that touches it starts these shards again.
on:
  push:
    branches: [validation/balancing-evaluation]
    paths: [.github/workflows/balancing-evaluation-missing-shards.yaml]

permissions:
  contents: read

concurrency:
  group: balancing-evaluation-missing-shards
  cancel-in-progress: false

jobs:
  shard:
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [4, 5, 7, 8, 10, 13, 18, 20]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      RUNNER: inst/benchmarks/balancing_evaluation/04_balancing_simulation.R
      RUNNER_MD5: efe0a3193c9253b956c44094e0acc83c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify the frozen runner
        run: echo "$RUNNER_MD5  $RUNNER" | md5sum --check

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          dependencies: '"hard"'
          extra-packages: any::dbarts, any::huge

      - name: Install this checkout
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Run the software checks
        run: Rscript "$RUNNER" --mode check

      - name: Run the shard
        run: Rscript "$RUNNER" --mode full --shard ${{ matrix.shard }} --shards 20 --out results --confirm-authorized-run

      - name: Record the environment
        if: always()
        run: |
          mkdir -p results/full
          echo "$GITHUB_SHA" > "results/full/shard-${{ matrix.shard }}-commit.txt"
          Rscript -e 'writeLines(capture.output(sessionInfo()), "results/full/shard-${{ matrix.shard }}-session.txt")'

      - name: Keep the records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: balancing-evaluation-shard-${{ matrix.shard }}
          path: results
          retention-days: 90
